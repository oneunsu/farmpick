{% extends 'base.html' %}
{% block title %}로그인 - FarmPick{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card p-4 mt-3">
      <div class="text-center mb-4">
        <i class="bi bi-leaf-fill text-success" style="font-size:2.5rem;"></i>
        <h4 class="mt-2 fw-bold">FarmPick 로그인</h4>
        <p class="text-muted small">스마트 농업 캘린더</p>
      </div>

      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-semibold">아이디</label>
          <input type="text" name="username" class="form-control" placeholder="아이디" autofocus required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">비밀번호</label>
          <input type="password" name="password" class="form-control" placeholder="비밀번호" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
          <i class="bi bi-box-arrow-in-right me-1"></i>로그인
        </button>
      </form>

      <hr class="my-3">
      <p class="text-center text-muted small mb-0">
        계정이 없으신가요?
        <a href="{% url 'signup' %}" class="text-success fw-semibold">회원가입</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
